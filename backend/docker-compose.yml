# CloudArena backend - local stack
#   docker compose up --build        (run from this backend/ directory)
#
# Public entry point: http://localhost:8080
#   API:        http://localhost:8080/api/match/join   (use http://localhost:8080/api in the game's ONLINE menu)
#   WebSockets: ws://localhost:8080/g1/ws/<room> or /g2/... (handed out by the API)
#
# Each game-server container is a "game host": it starts one headless Godot match process per room.

name: cloud-arena

networks:
  net: {}

volumes:
  redis-data: {}

x-api: &api
  build: { context: ./matchmaking_api }
  restart: unless-stopped
  environment:
    REDIS_URL: "redis://redis:6379"
    SERVER_KEY: "${SERVER_KEY:?set SERVER_KEY in backend/.env}"
  depends_on:
    redis: { condition: service_healthy }
  networks: [net]

x-game: &game
  build:
    context: ..                              # repository root: the Godot project ships inside the image
    dockerfile: backend/game_server/Dockerfile
  restart: unless-stopped
  depends_on:
    redis: { condition: service_healthy }
  networks: [net]

services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes: [redis-data:/data]
    ports: ["6379:6379"]
    networks: [net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  matchmaking-api-1:
    <<: *api
  matchmaking-api-2:
    <<: *api

  game-server-1:
    <<: *game
    environment:
      REDIS_URL: "redis://redis:6379"
      SERVER_ID: "game-1"
      PORT: "8765"
      PUBLIC_WS_BASE: "ws://localhost:8080/g1"
      API_URL: "http://matchmaking-api-1:8000"
      MAX_ROOMS: "20"
      SERVER_KEY: "${SERVER_KEY:?set SERVER_KEY in backend/.env}"
  game-server-2:
    <<: *game
    environment:
      REDIS_URL: "redis://redis:6379"
      SERVER_ID: "game-2"
      PORT: "8765"
      PUBLIC_WS_BASE: "ws://localhost:8080/g2"
      API_URL: "http://matchmaking-api-2:8000"
      MAX_ROOMS: "20"
      SERVER_KEY: "${SERVER_KEY:?set SERVER_KEY in backend/.env}"

  nginx:
    build: { context: ./nginx }
    restart: unless-stopped
    ports: ["8080:80"]
    depends_on: [matchmaking-api-1, matchmaking-api-2, game-server-1, game-server-2]
    networks: [net]
