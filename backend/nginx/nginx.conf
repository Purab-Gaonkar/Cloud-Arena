# ── NGINX — WebSocket Load Balancer ──────────────────────────────────────────
#
# Routes:
#   /ws          → game-server pool (sticky by ip_hash for WebSocket continuity)
#   /api/        → matchmaking-api pool (round-robin HTTP)
#   /            → matchmaking-api root (health, docs)
#
# Sticky sessions via ip_hash keep a player connected to the same game-server
# instance throughout their match (required because room state is per-process).
#
# Upstream names resolve to Docker Compose service names.

events {
    worker_connections 4096;
}

http {
    # ── Logging ───────────────────────────────────────────────────────────────
    log_format main '$remote_addr "$request" $status '
                    'upstream=$upstream_addr rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Upstream: Game Servers (WebSocket) ────────────────────────────────────
    # ip_hash = sticky session: same client IP always hits the same server pod.
    # Scale by adding more game_server_N entries.
    upstream game_servers {
        ip_hash;

        server game-server-1:8765;
        server game-server-2:8765;
        # server game-server-3:8765;  # un-comment to add a third pod

        keepalive 64;
    }

    # ── Upstream: Matchmaking API (HTTP) ─────────────────────────────────────
    upstream matchmaking_api {
        least_conn;

        server matchmaking-api-1:8000;
        server matchmaking-api-2:8000;

        keepalive 16;
    }

    # ── Upstream: Health Probes (per game-server) ─────────────────────────────
    # Health check hits /health on port 8766 of every game-server.
    # NGINX Plus supports active health checks; OSS uses passive + try_files.
    upstream game_server_health {
        server game-server-1:8766;
        server game-server-2:8766;
    }

    # ── Server ────────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # ── WebSocket upgrade headers ─────────────────────────────────────────
        map $http_upgrade $connection_upgrade {
            default upgrade;
            ''      close;
        }

        # ── /ws  →  Game Server WebSocket ─────────────────────────────────────
        location /ws {
            proxy_pass         http://game_servers;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;

            # Keep WebSocket alive for long matches
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;

            # Disable buffering for real-time data
            proxy_buffering     off;
        }

        # ── /api/  →  Matchmaking REST API ────────────────────────────────────
        location /api/ {
            proxy_pass         http://matchmaking_api/;
            proxy_http_version 1.1;
            proxy_set_header   Host             $host;
            proxy_set_header   X-Real-IP        $remote_addr;
            proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }

        # ── /nginx-health  →  NGINX self-check ───────────────────────────────
        location /nginx-health {
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        # ── /  →  API docs / root ─────────────────────────────────────────────
        location / {
            proxy_pass         http://matchmaking_api;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
        }
    }
}
