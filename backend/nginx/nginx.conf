# CloudArena - public entry point (local Docker Compose)
#   /api/...  -> matchmaking API pool (least_conn)
#   /g1/...   -> game host 1   (WebSocket: ws://localhost:8080/g1/ws/<room>)
#   /g2/...   -> game host 2
# Each game host advertises its own prefix as PUBLIC_WS_BASE, so a client is always routed to the
# host that owns its room. Rooms are never split across hosts.
worker_processes auto;
events { worker_connections 4096; }

http {
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    upstream matchmaking_api {
        least_conn;
        server matchmaking-api-1:8000;
        server matchmaking-api-2:8000;
    }

    server {
        listen 80;

        location = /nginx-health { return 200 "ok
"; add_header Content-Type text/plain; }

        location /api/ {
            proxy_pass http://matchmaking_api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /docs         { proxy_pass http://matchmaking_api; }
        location /openapi.json { proxy_pass http://matchmaking_api; }

        location /g1/ {
            proxy_pass http://game-server-1:8765/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
        location /g2/ {
            proxy_pass http://game-server-2:8765/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
